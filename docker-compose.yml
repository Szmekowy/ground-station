version: "3.8"

services:

  mqtt:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
  
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ground_station

    ports:
      - "5432:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data

  communication:
    build: ./src/Communication
    ports:
      - "8001:8001"
    depends_on:
      - mqtt
    volumes:
    - ./src/config:/workspace/config

  backend:
    build: ./src/Backend
    ports:
      - "8002:8002"
    depends_on:
      - communication
      - postgres
    volumes:
      - ./data:/workspace/data
      - ./tests:/workspace/tests
      - ./src/config:/workspace/config
    environment:
    - PYTHONPATH=/workspace
  ai:
    build: ./src/AI
    ports:
      - "8003:8003"
    depends_on:
      - backend
    volumes:
    - ./src/config:/workspace/config

  ui:
    build: ./src/UI
    ports:
      - "8000:8000"
    depends_on:
      - backend
    environment:
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ./src/config:/workspace/config

volumes:
  postgres_data: