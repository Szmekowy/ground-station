version: "3.8"

services:

  mqtt:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"

  communication:
    build: ./src/Communication
    ports:
      - "8001:8001"
    depends_on:
      - mqtt

  backend:
    build: ./src/Backend
    ports:
      - "8002:8002"
    depends_on:
      - communication
    volumes:
      - ./data:/workspace/data

  ai:
    build: ./src/AI
    ports:
      - "8003:8003"
    depends_on:
      - backend

  ui:
    build: ./src/UI
    ports:
      - "8000:8000"
    depends_on:
      - backend
